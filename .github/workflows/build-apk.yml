name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: echo "PROJECT_DIR=$(dirname $(find . -name package.json -not -path '*/node_modules/*' | head -1))" >> $GITHUB_ENV
      - name: Prepare www and config
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p www
          for f in index.html ai.html lab.html; do
            p=$(find . -name "$f" -not -path './node_modules/*' -not -path './www/*' | head -1)
            if [ -n "$p" ]; then cp "$p" "www/$f"; fi
          done
          ls www
          test -f www/index.html || (echo "HTML files missing in repository" && exit 1)
          echo '{"appId":"com.science3d.app","appName":"Science3D","webDir":"www","android":{"backgroundColor":"#0d1b19"},"plugins":{"CapacitorHttp":{"enabled":true}}}' > capacitor.config.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npm run vendor
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npx cap add android
        working-directory: ${{ env.PROJECT_DIR }}
      - run: npx cap sync android
        working-directory: ${{ env.PROJECT_DIR }}
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}/android
      - uses: actions/upload-artifact@v4
        with:
          name: Science3D-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
