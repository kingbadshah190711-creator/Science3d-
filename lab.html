<script>
const stage=document.getElementById('stage'),info=document.getElementById('info');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
let zoom=7;
const amb=new THREE.AmbientLight(0xffffff,.7);scene.add(amb);
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,5);scene.add(dl);
let group=new THREE.Group();scene.add(group);
let labels=[],anim=[],ticks=[],autoRot=true,showLab=true;

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------- helpers ---------- */
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.1},o));
function sph(r,c,pos,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(c,o));m.position.set(...pos);return m}
function bond(a,b,order){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),L=d.length(),dir=d.clone().normalize();
  let off=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1));if(off.length()<.1)off.set(0,1,0);off.normalize().multiplyScalar(.1);
  const g=new THREE.Group(),offs=order==3?[-1,0,1]:order==2?[-1,1]:[0];
  offs.forEach(s=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,L,12),mat(0x9aa7a4));
    m.position.copy(A).add(B).multiplyScalar(.5).add(off.clone().multiplyScalar(s));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);g.add(m)});
  return g}
function addLabel(text,pos,html){
  const el=document.createElement('div');el.className='lab';el.textContent=text;
  el.onclick=e=>{e.stopPropagation();labels.forEach(l=>l.el.classList.remove('sel'));el.classList.add('sel');if(html)showInfo(html)};
  stage.appendChild(el);labels.push({el,pos:new THREE.Vector3(...pos)})}
function showInfo(h){info.innerHTML=h}
function clearAll(){scene.remove(group);group=new THREE.Group();scene.add(group);labels.forEach(l=>l.el.remove());labels=[];anim=[];ticks=[];amb.intensity=.7;dl.intensity=.9;group.position.set(0,0,0);group.rotation.set(.3,0,0);zoom=7;document.getElementById('pt').style.display='none';document.querySelector('.tools').style.display=''}

/* ---------- ATOMS (Chemistry) ---------- */
const EL='H Hydrogen 1.008|He Helium 4.003|Li Lithium 6.94|Be Beryllium 9.012|B Boron 10.81|C Carbon 12.011|N Nitrogen 14.007|O Oxygen 15.999|F Fluorine 18.998|Ne Neon 20.180|Na Sodium 22.990|Mg Magnesium 24.305|Al Aluminium 26.982|Si Silicon 28.085|P Phosphorus 30.974|S Sulphur 32.06|Cl Chlorine 35.45|Ar Argon 39.948|K Potassium 39.098|Ca Calcium 40.078|Sc Scandium 44.956|Ti Titanium 47.867|V Vanadium 50.942|Cr Chromium 51.996|Mn Manganese 54.938|Fe Iron 55.845|Co Cobalt 58.933|Ni Nickel 58.693|Cu Copper 63.546|Zn Zinc 65.38|Ga Gallium 69.723|Ge Germanium 72.630|As Arsenic 74.922|Se Selenium 78.971|Br Bromine 79.904|Kr Krypton 83.798|Rb Rubidium 85.468|Sr Strontium 87.62|Y Yttrium 88.906|Zr Zirconium 91.224|Nb Niobium 92.906|Mo Molybdenum 95.95|Tc Technetium 98|Ru Ruthenium 101.07|Rh Rhodium 102.906|Pd Palladium 106.42|Ag Silver 107.868|Cd Cadmium 112.414|In Indium 114.818|Sn Tin 118.710|Sb Antimony 121.760|Te Tellurium 127.60|I Iodine 126.904|Xe Xenon 131.293|Cs Caesium 132.905|Ba Barium 137.327|La Lanthanum 138.905|Ce Cerium 140.116|Pr Praseodymium 140.908|Nd Neodymium 144.242|Pm Promethium 145|Sm Samarium 150.36|Eu Europium 151.964|Gd Gadolinium 157.25|Tb Terbium 158.925|Dy Dysprosium 162.500|Ho Holmium 164.930|Er Erbium 167.259|Tm Thulium 168.934|Yb Ytterbium 173.045|Lu Lutetium 174.967|Hf Hafnium 178.49|Ta Tantalum 180.948|W Tungsten 183.84|Re Rhenium 186.207|Os Osmium 190.23|Ir Iridium 192.217|Pt Platinum 195.084|Au Gold 196.967|Hg Mercury 200.592|Tl Thallium 204.38|Pb Lead 207.2|Bi Bismuth 208.980|Po Polonium 209|At Astatine 210|Rn Radon 222|Fr Francium 223|Ra Radium 226|Ac Actinium 227|Th Thorium 232.038|Pa Protactinium 231.036|U Uranium 238.029|Np Neptunium 237|Pu Plutonium 244|Am Americium 243|Cm Curium 247|Bk Berkelium 247|Cf Californium 251|Es Einsteinium 252|Fm Fermium 257|Md Mendelevium 258|No Nobelium 259|Lr Lawrencium 262|Rf Rutherfordium 267|Db Dubnium 268|Sg Seaborgium 269|Bh Bohrium 270|Hs Hassium 277|Mt Meitnerium 278|Ds Darmstadtium 281|Rg Roentgenium 282|Cn Copernicium 285|Nh Nihonium 286|Fl Flerovium 289|Mc Moscovium 290|Lv Livermorium 293|Ts Tennessine 294|Og Oganesson 294';
const ORB=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]];
const OVR={24:{'4s':1,'3d':5},29:{'4s':1,'3d':10},41:{'5s':1,'4d':4},42:{'5s':1,'4d':5},44:{'5s':1,'4d':7},45:{'5s':1,'4d':8},46:{'5s':0,'4d':10},47:{'5s':1,'4d':10},57:{'4f':0,'5d':1},58:{'4f':1,'5d':1},64:{'4f':7,'5d':1},78:{'5d':9,'6s':1},79:{'5d':10,'6s':1},89:{'5f':0,'6d':1},90:{'5f':0,'6d':2},91:{'5f':2,'6d':1},92:{'5f':3,'6d':1},93:{'5f':4,'6d':1},96:{'5f':7,'6d':1},103:{'6d':0,'7p':1}};
function config(z){let r=z;const o={};for(const [n,c] of ORB){const t=Math.min(r,c);o[n]=t;r-=t}Object.assign(o,OVR[z]||{});return o}
const ATOMS={};EL.split('|').forEach((s,i)=>{const [k,n,m]=s.split(' '),z=i+1,o=config(z),sh=[];for(const [q,v] of Object.entries(o)){if(v>0){const x=+q[0]-1;sh[x]=(sh[x]||0)+v}}ATOMS[k]={n,z,m,sh,o}});
function buildAtom(k){
  clearAll();const d=ATOMS[k];group.add(sph(.35,0xe0524a,[0,0,0]));
  const names='KLMNOPQ',cols=[0x5ab0ff,0x6be08a,0xffc857,0xff8fa3,0xb18cff,0xff9f5a,0x7fe3e3],n=d.sh.length,gap=n>4?.5:.8;
  zoom=Math.max(7,(.9+(n-1)*gap)*2.6+1.5);
  d.sh.forEach((cnt,i)=>{
    const r=.9+i*gap,sub=new THREE.Group();sub.rotation.set(i*.5,i*.4,i*.3);
    sub.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,80),mat(0x889995)));
    for(let e=0;e<cnt;e++){const m=sph(n>4?.07:.1,cols[i],[0,0,0],{emissive:cols[i],emissiveIntensity:.3});sub.add(m);anim.push({m,r,a:e/cnt*Math.PI*2,s:.012/(1+i*.4)})}
    group.add(sub);const v=new THREE.Vector3(r,0,0).applyEuler(sub.rotation);
    addLabel(names[i]+' ('+cnt+')',[v.x,v.y,v.z],`<span class="tag">Atomic Structure</span><h2>${names[i]} shell (n = ${i+1})</h2><p>${cnt} electron(s). Maximum capacity 2n² = ${2*(i+1)*(i+1)}.</p>`)});
  const p=d.z,nn=Math.round(parseFloat(d.m))-p,ve=d.sh[n-1],val=p<=20?((p==2||ve==8)?0:(ve<=4?ve:8-ve)):null;
  const sup=v=>String(v).replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
  const cfg=Object.entries(d.o).filter(e=>e[1]>0).sort((a,b)=>a[0][0]-b[0][0]||'spdf'.indexOf(a[0][1])-'spdf'.indexOf(b[0][1])).map(e=>e[0]+sup(e[1])).join(' ');
  const rad=(p==43||p==61||p>=84)?' (most stable isotope)':'';
  const html=`<span class="tag">Class 9–12 · NEET · JEE</span><h2>${d.n} (${k})</h2><p>Atomic number Z = ${p} · Atomic mass = ${d.m} u${rad}</p><p>Protons = ${p}, Neutrons ≈ ${nn}, Electrons = ${p}.</p><p>Shells (K, L, M…): ${d.sh.join(', ')}</p><p>Configuration: ${cfg}</p><p>${val!==null?`Valence electrons: ${ve} · Valency: ${val}`:`Outermost shell electrons: ${ve}`}</p>`;
  addLabel('Nucleus',[0,.35,0],html);showInfo(html)}
/* ---------- MOLECULES (Chemistry) ---------- */
const COL={H:0xf2f2f2,O:0xe0524a,C:0x4a4f55,N:0x4a7bff,F:0x7ee07e,Cl:0x39c24a,B:0xe8a0a0,S:0xffd23f,P:0xff9f1a,Xe:0x429eb0,Be:0xc2ff00};const RAD={H:.3,O:.46,C:.44,N:.44,F:.4,Cl:.55,B:.42,S:.55,P:.55,Xe:.65,Be:.4};
const t=.63;
const MOLS={
 water:{n:'Water',f:'H₂O',at:[['O',0,0,0],['H',.76,-.59,0],['H',-.76,-.59,0]],bd:[[0,1,1],[0,2,1]],i:'Bent shape · bond angle 104.5° · sp³ (2 lone pairs on O) · polar, H-bonding.'},
 methane:{n:'Methane',f:'CH₄',at:[['C',0,0,0],['H',t,t,t],['H',-t,-t,t],['H',-t,t,-t],['H',t,-t,-t]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]],i:'Tetrahedral · bond angle 109.5° · sp³ hybridisation · non-polar.'},
 co2:{n:'Carbon dioxide',f:'CO₂',at:[['C',0,0,0],['O',-1.16,0,0],['O',1.16,0,0]],bd:[[0,1,2],[0,2,2]],i:'Linear · bond angle 180° · sp hybridisation · two C=O double bonds · non-polar overall.'},
 ammonia:{n:'Ammonia',f:'NH₃',at:[['N',0,.3,0],['H',.85,-.15,0],['H',-.42,-.15,.74],['H',-.42,-.15,-.74]],bd:[[0,1,1],[0,2,1],[0,3,1]],i:'Trigonal pyramidal · bond angle ≈107° · sp³ (1 lone pair on N) · polar.'},
 hcl:{n:'Hydrogen chloride',f:'HCl',at:[['Cl',0,0,0],['H',1.27,0,0]],bd:[[0,1,1]],i:'Linear · polar covalent bond (Cl more electronegative) · dipole moment ≈ 1.03 D.'},
 o2:{n:'Oxygen',f:'O₂',at:[['O',-.6,0,0],['O',.6,0,0]],bd:[[0,1,2]],i:'O=O double bond (1σ + 1π) · non-polar · paramagnetic (2 unpaired electrons, MOT).'},
 n2:{n:'Nitrogen',f:'N₂',at:[['N',-.55,0,0],['N',.55,0,0]],bd:[[0,1,3]],i:'N≡N triple bond (1σ + 2π) · very stable, high bond energy · non-polar.'},
 bf3:{n:'Boron trifluoride',f:'BF₃',at:[['B',0,0,0],['F',0,1.3,0],['F',-1.13,-.65,0],['F',1.13,-.65,0]],bd:[[0,1,1],[0,2,1],[0,3,1]],i:'Trigonal planar · bond angle 120° · sp² · incomplete octet on B (6 electrons) · Lewis acid.'},
 ethene:{n:'Ethene',f:'C₂H₄',at:[['C',-.67,0,0],['C',.67,0,0],['H',-1.24,.93,0],['H',-1.24,-.93,0],['H',1.24,.93,0],['H',1.24,-.93,0]],bd:[[0,1,2],[0,2,1],[0,3,1],[1,4,1],[1,5,1]],i:'Planar · bond angle ≈ 120° · sp² · C=C has one σ and one π bond.'},
 ethyne:{n:'Ethyne',f:'C₂H₂',at:[['C',-.6,0,0],['C',.6,0,0],['H',-1.66,0,0],['H',1.66,0,0]],bd:[[0,1,3],[0,2,1],[1,3,1]],i:'Linear · bond angle 180° · sp · C≡C has one σ and two π bonds.'},
 sf6:{n:'Sulphur hexafluoride',f:'SF₆',at:[['S',0,0,0],['F',1.56,0,0],['F',-1.56,0,0],['F',0,1.56,0],['F',0,-1.56,0],['F',0,0,1.56],['F',0,0,-1.56]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1],[0,5,1],[0,6,1]],i:'Octahedral · all angles 90° · sp³d² · no lone pairs · non-polar.'},
 pcl5:{n:'Phosphorus pentachloride',f:'PCl₅',at:[['P',0,0,0],['Cl',0,2.14,0],['Cl',0,-2.14,0],['Cl',2.02,0,0],['Cl',-1.01,0,1.75],['Cl',-1.01,0,-1.75]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1],[0,5,1]],i:'Trigonal bipyramidal · equatorial angles 120°, axial–equatorial 90° · sp³d · axial bonds are longer than equatorial bonds · non-polar.'},
 xef4:{n:'Xenon tetrafluoride',f:'XeF₄',at:[['Xe',0,0,0],['F',1.95,0,0],['F',-1.95,0,0],['F',0,0,1.95],['F',0,0,-1.95]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]],i:'Square planar · 90° · sp³d² · two lone pairs on Xe (above and below the plane, not drawn) · non-polar.'},
 clf3:{n:'Chlorine trifluoride',f:'ClF₃',at:[['Cl',0,0,0],['F',0,1.7,0],['F',0,-1.7,0],['F',1.6,0,0]],bd:[[0,1,1],[0,2,1],[0,3,1]],i:'T-shaped · F–Cl–F ≈ 87.5° · sp³d · two lone pairs in the equatorial plane · polar.'},
 sf4:{n:'Sulphur tetrafluoride',f:'SF₄',at:[['S',0,0,0],['F',0,1.65,0],['F',0,-1.65,0],['F',1.0,0,1.25],['F',1.0,0,-1.25]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]],i:'See-saw · axial ≈ 173°, equatorial ≈ 102° · sp³d · one lone pair in the equatorial position · polar.'},
 becl2:{n:'Beryllium chloride',f:'BeCl₂',at:[['Be',0,0,0],['Cl',1.75,0,0],['Cl',-1.75,0,0]],bd:[[0,1,1],[0,2,1]],i:'Linear · 180° · sp · incomplete octet on Be (4 electrons) · non-polar.'}};
{const bz={n:'Benzene',f:'C₆H₆',at:[],bd:[],i:'Planar hexagon · all C–C bonds equal (139 pm) · 120° · sp² · delocalised π electrons (resonance, aromatic). Kekulé structure shown.'};
for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.at.push(['C',1.4*Math.cos(a),1.4*Math.sin(a),0])}
for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.at.push(['H',2.5*Math.cos(a),2.5*Math.sin(a),0])}

function buildMol(k){
  clearAll();const m=MOLS[k];
  m.at.forEach(a=>{group.add(sph(RAD[a[0]],COL[a[0]],[a[1],a[2],a[3]]));addLabel(a[0],[a[1],a[2]+RAD[a[0]],a[3]],null)});

  labels.forEach(l=>l.el.onclick=e=>{e.stopPropagation();showInfo(html)});showInfo(html)}

/* ---------- ANIMAL CELL (Biology) ---------- */
function buildCell(plant){
  clearAll();
  group.add(new THREE.Mesh(new THREE.SphereGeometry(2.2,40,28),mat(0x7fd1c0,{transparent:true,opacity:.14,depthWrite:false})));
  const O=[];

Object.keys(SUBJ).forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>pickSubj(s);subjEl.appendChild(b)});
let acN=0;async function ac(q){if(q.length<2)return;const my=++acN;try{const r=await fetch('https://pubchem.ncbi.nlm.nih.gov/rest/autocomplete/compound/'+encodeURIComponent(q)+'/json?limit=30');const d=await r.json();if(my!==acN)return;const nm=(d.dictionary_terms&&d.dictionary_terms.compound)||[];if(!nm.length)return;itemsEl.innerHTML='';nm.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=n;b.onclick=()=>{[...itemsEl.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');searchCompound(n)};itemsEl.appendChild(b)})}catch(e){}}
document.getElementById('sr').oninput=e=>{const q=e.target.value.toLowerCase();if(isCS(curSubj)){clearTimeout(window.__act);window.__act=setTimeout(()=>ac(e.target.value.trim()),350)}[...itemsEl.children].forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?'':'none')};
document.getElementById('sr').onkeydown=e=>{if(e.key==='Enter'&&isCS(curSubj)){e.preventDefault();const q=e.target.value.trim();if(q)searchCompound(q)}};
document.getElementById('bLab').onclick=e=>{showLab=!showLab;e.target.classList.toggle('on',showLab)};
document.getElementById('bRot').onclick=e=>{autoRot=!autoRot;e.target.classList.toggle('on',autoRot)};

/* ---------- controls: drag rotate, wheel + pinch zoom ---------- */
const ptr=new Map();let pinch=0;
stage.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,[e.clientX,e.clientY]);pinch=0});
stage.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
stage.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
stage.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
  if(ptr.size==1){group.rotation.y+=(e.clientX-p[0])*.01;group.rotation.x+=(e.clientY-p[1])*.01}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size==2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoom=Math.min(60,Math.max(3,zoom*pinch/d));pinch=d}});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(60,Math.max(3,zoom+e.deltaY*.005))},{passive:false});

/* ---------- loop ---------- */
const v=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  if(autoRot&&!ptr.size)group.rotation.y+=.004;
  ticks.forEach(f=>f());
  anim.forEach(o=>{o.a+=o.s;o.m.position.set(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r,0)});
  camera.position.z=zoom;
  group.updateMatrixWorld(true);
  const w=stage.clientWidth,h=stage.clientHeight;
  labels.forEach(l=>{v.copy(l.pos);group.localToWorld(v);v.project(camera);
    l.el.style.display=showLab?'block':'none';
    l.el.style.left=((v.x+1)/2*w)+'px';l.el.style.top=((1-v.y)/2*h)+'px'});
  renderer.render(scene,camera)}
resize();pickSubj('Chemistry · Periodic Table');loop();
</script>
