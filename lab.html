<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science3D – 3D Diagram Lab</title>
<script src="three.min.js"></script>
<style>
:root{--bg:#eef3f1;--fg:#12302b;--card:#ffffff;--mut:#51706a;--ac:#0f8f78;--bd:#cfdcd8;--lb:rgba(255,255,255,.92);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b19;--fg:#e3f3ef;--card:#152926;--mut:#8fb0a9;--ac:#3ed1b4;--bd:#25423d;--lb:rgba(21,41,38,.92)}}
:root[data-theme="dark"]{--bg:#0d1b19;--fg:#e3f3ef;--card:#152926;--mut:#8fb0a9;--ac:#3ed1b4;--bd:#25423d;--lb:rgba(21,41,38,.92)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 12px 6px}
h1{font-size:18px;margin:0 0 8px;letter-spacing:.2px}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.on{background:var(--ac);color:#04231d;border-color:var(--ac);font-weight:700}
#stage{flex:1;position:relative;min-height:0;touch-action:none;cursor:grab}
#stage canvas{display:block;width:100%;height:100%}
.lab{position:absolute;left:0;top:0;transform:translate(-50%,-130%);background:var(--lb);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 7px;font-size:12px;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lab.sel{border-color:var(--ac);font-weight:700}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.tools button{border-radius:10px;padding:6px 10px;font-size:13px}
#info{background:var(--card);border-top:1px solid var(--bd);padding:10px 14px 12px;max-height:34%;overflow:auto}
#info h2{font-size:16px;margin:0 0 4px}
#info p{margin:0 0 4px;font-size:14px;line-height:1.5;color:var(--mut)}
#info .tag{font-size:12px;color:var(--ac);font-weight:700}
#sr{width:100%;margin-bottom:6px;font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 10px}#items{flex-wrap:wrap;max-height:112px;overflow-y:auto}#info button{margin-top:6px;background:var(--ac);color:#04231d;border-color:var(--ac);font-weight:700}#pt{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:8px;display:none;touch-action:pan-x pan-y}.lg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.lg span{font-size:11px;color:#12302b;padding:2px 7px;border-radius:999px}.ptg{display:grid;grid-template-columns:repeat(18,44px);grid-template-rows:16px repeat(7,48px) 12px 48px 48px;gap:2px;width:max-content}.gh{font-size:10px;color:var(--mut);text-align:center;font-style:normal}.el{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;color:#12302b;cursor:pointer;line-height:1.1}.el .z{font-size:9px;align-self:flex-start;padding-left:3px}.el .s{font-size:15px;font-weight:700}.el .m{font-size:8px}</style>
</head>
<body>
<header>
<h1>Science3D – 3D Diagram Lab</h1>
<div class="row" id="subj"></div>
<input id="sr" placeholder="Search atom / molecule…" aria-label="Search"><div class="row" id="items"></div>
</header>
<div id="stage">
<div id="pt"></div><div class="tools">
<button id="bLab" class="on">Labels</button>
<button id="bRot" class="on">Auto-rotate</button>
</div>
</div>
<div id="info"></div>

<script>
const stage=document.getElementById('stage'),info=document.getElementById('info');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
let zoom=7;
scene.add(new THREE.AmbientLight(0xffffff,.7));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(4,6,5);scene.add(dl);
let group=new THREE.Group();scene.add(group);
let labels=[],anim=[],autoRot=true,showLab=true;

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);

/* ---------- helpers ---------- */
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.45,metalness:.1},o));
function sph(r,c,pos,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(c,o));m.position.set(...pos);return m}
function bond(a,b,order){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),L=d.length(),dir=d.clone().normalize();
  let off=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1));if(off.length()<.1)off.set(0,1,0);off.normalize().multiplyScalar(.1);
  const g=new THREE.Group(),offs=order==3?[-1,0,1]:order==2?[-1,1]:[0];
  offs.forEach(s=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,L,12),mat(0x9aa7a4));
    m.position.copy(A).add(B).multiplyScalar(.5).add(off.clone().multiplyScalar(s));
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);g.add(m)});
  return g}
function addLabel(text,pos,html){
  const el=document.createElement('div');el.className='lab';el.textContent=text;
  el.onclick=e=>{e.stopPropagation();labels.forEach(l=>l.el.classList.remove('sel'));el.classList.add('sel');if(html)showInfo(html)};
  stage.appendChild(el);labels.push({el,pos:new THREE.Vector3(...pos)})}
function showInfo(h){info.innerHTML=h}
function clearAll(){scene.remove(group);group=new THREE.Group();scene.add(group);labels.forEach(l=>l.el.remove());labels=[];anim=[];group.rotation.set(.3,0,0);zoom=7;document.getElementById('pt').style.display='none';document.querySelector('.tools').style.display=''}

/* ---------- ATOMS (Chemistry) ---------- */
const EL='H Hydrogen 1.008|He Helium 4.003|Li Lithium 6.94|Be Beryllium 9.012|B Boron 10.81|C Carbon 12.011|N Nitrogen 14.007|O Oxygen 15.999|F Fluorine 18.998|Ne Neon 20.180|Na Sodium 22.990|Mg Magnesium 24.305|Al Aluminium 26.982|Si Silicon 28.085|P Phosphorus 30.974|S Sulphur 32.06|Cl Chlorine 35.45|Ar Argon 39.948|K Potassium 39.098|Ca Calcium 40.078|Sc Scandium 44.956|Ti Titanium 47.867|V Vanadium 50.942|Cr Chromium 51.996|Mn Manganese 54.938|Fe Iron 55.845|Co Cobalt 58.933|Ni Nickel 58.693|Cu Copper 63.546|Zn Zinc 65.38|Ga Gallium 69.723|Ge Germanium 72.630|As Arsenic 74.922|Se Selenium 78.971|Br Bromine 79.904|Kr Krypton 83.798|Rb Rubidium 85.468|Sr Strontium 87.62|Y Yttrium 88.906|Zr Zirconium 91.224|Nb Niobium 92.906|Mo Molybdenum 95.95|Tc Technetium 98|Ru Ruthenium 101.07|Rh Rhodium 102.906|Pd Palladium 106.42|Ag Silver 107.868|Cd Cadmium 112.414|In Indium 114.818|Sn Tin 118.710|Sb Antimony 121.760|Te Tellurium 127.60|I Iodine 126.904|Xe Xenon 131.293|Cs Caesium 132.905|Ba Barium 137.327|La Lanthanum 138.905|Ce Cerium 140.116|Pr Praseodymium 140.908|Nd Neodymium 144.242|Pm Promethium 145|Sm Samarium 150.36|Eu Europium 151.964|Gd Gadolinium 157.25|Tb Terbium 158.925|Dy Dysprosium 162.500|Ho Holmium 164.930|Er Erbium 167.259|Tm Thulium 168.934|Yb Ytterbium 173.045|Lu Lutetium 174.967|Hf Hafnium 178.49|Ta Tantalum 180.948|W Tungsten 183.84|Re Rhenium 186.207|Os Osmium 190.23|Ir Iridium 192.217|Pt Platinum 195.084|Au Gold 196.967|Hg Mercury 200.592|Tl Thallium 204.38|Pb Lead 207.2|Bi Bismuth 208.980|Po Polonium 209|At Astatine 210|Rn Radon 222|Fr Francium 223|Ra Radium 226|Ac Actinium 227|Th Thorium 232.038|Pa Protactinium 231.036|U Uranium 238.029|Np Neptunium 237|Pu Plutonium 244|Am Americium 243|Cm Curium 247|Bk Berkelium 247|Cf Californium 251|Es Einsteinium 252|Fm Fermium 257|Md Mendelevium 258|No Nobelium 259|Lr Lawrencium 262|Rf Rutherfordium 267|Db Dubnium 268|Sg Seaborgium 269|Bh Bohrium 270|Hs Hassium 277';
const ORB=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2],['4d',10],['5p',6],['6s',2],['4f',14],['5d',10],['6p',6],['7s',2],['5f',14],['6d',10],['7p',6]];
const OVR={24:{'4s':1,'3d':5},29:{'4s':1,'3d':10},41:{'5s':1,'4d':4},42:{'5s':1,'4d':5},44:{'5s':1,'4d':7},45:{'5s':1,'4d':8},46:{'5s':0,'4d':10},47:{'5s':1,'4d':10},57:{'4f':0,'5d':1},58:{'4f':1,'5d':1},64:{'4f':7,'5d':1},78:{'5d':9,'6s':1},79:{'5d':10,'6s':1},89:{'5f':0,'6d':1},90:{'5f':0,'6d':2},91:{'5f':2,'6d':1},92:{'5f':3,'6d':1},93:{'5f':4,'6d':1},96:{'5f':7,'6d':1},103:{'6d':0,'7p':1}};
function config(z){let r=z;const o={};for(const [n,c] of ORB){const t=Math.min(r,c);o[n]=t;r-=t}Object.assign(o,OVR[z]||{});return o}
const ATOMS={};EL.split('|').forEach((s,i)=>{const [k,n,m]=s.split(' '),z=i+1,o=config(z),sh=[];for(const [q,v] of Object.entries(o)){if(v>0){const x=+q[0]-1;sh[x]=(sh[x]||0)+v}}ATOMS[k]={n,z,m,sh,o}});
function buildAtom(k){
  clearAll();const d=ATOMS[k];group.add(sph(.35,0xe0524a,[0,0,0]));
  const names='KLMNOPQ',cols=[0x5ab0ff,0x6be08a,0xffc857,0xff8fa3,0xb18cff,0xff9f5a,0x7fe3e3],n=d.sh.length,gap=n>4?.5:.8;
  zoom=Math.max(7,(.9+(n-1)*gap)*2.6+1.5);
  d.sh.forEach((cnt,i)=>{
    const r=.9+i*gap,sub=new THREE.Group();sub.rotation.set(i*.5,i*.4,i*.3);
    sub.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,8,80),mat(0x889995)));
    for(let e=0;e<cnt;e++){const m=sph(n>4?.07:.1,cols[i],[0,0,0],{emissive:cols[i],emissiveIntensity:.3});sub.add(m);anim.push({m,r,a:e/cnt*Math.PI*2,s:.012/(1+i*.4)})}
    group.add(sub);const v=new THREE.Vector3(r,0,0).applyEuler(sub.rotation);
    addLabel(names[i]+' ('+cnt+')',[v.x,v.y,v.z],`<span class="tag">Atomic Structure</span><h2>${names[i]} shell (n = ${i+1})</h2><p>${cnt} electron(s). Maximum capacity 2n² = ${2*(i+1)*(i+1)}.</p>`)});
  const p=d.z,nn=Math.round(parseFloat(d.m))-p,ve=d.sh[n-1],val=p<=20?((p==2||ve==8)?0:(ve<=4?ve:8-ve)):null;
  const sup=v=>String(v).replace(/\d/g,c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
  const cfg=Object.entries(d.o).filter(e=>e[1]>0).sort((a,b)=>a[0][0]-b[0][0]||'spdf'.indexOf(a[0][1])-'spdf'.indexOf(b[0][1])).map(e=>e[0]+sup(e[1])).join(' ');
  const rad=(p==43||p==61||p>=84)?' (most stable isotope)':'';
  const html=`<span class="tag">Class 9–12 · NEET · JEE</span><h2>${d.n} (${k})</h2><p>Atomic number Z = ${p} · Atomic mass = ${d.m} u${rad}</p><p>Protons = ${p}, Neutrons ≈ ${nn}, Electrons = ${p}.</p><p>Shells (K, L, M…): ${d.sh.join(', ')}</p><p>Configuration: ${cfg}</p><p>${val!==null?`Valence electrons: ${ve} · Valency: ${val}`:`Outermost shell electrons: ${ve}`}</p>`;
  addLabel('Nucleus',[0,.35,0],html);showInfo(html)}
/* ---------- MOLECULES (Chemistry) ---------- */
const COL={H:0xf2f2f2,O:0xe0524a,C:0x4a4f55,N:0x4a7bff,F:0x7ee07e,Cl:0x39c24a,B:0xe8a0a0};const RAD={H:.3,O:.46,C:.44,N:.44,F:.4,Cl:.55,B:.42};
const t=.63;
const MOLS={
 water:{n:'Water',f:'H₂O',at:[['O',0,0,0],['H',.76,-.59,0],['H',-.76,-.59,0]],bd:[[0,1,1],[0,2,1]],i:'Bent shape · bond angle 104.5° · sp³ (2 lone pairs on O) · polar, H-bonding.'},
 methane:{n:'Methane',f:'CH₄',at:[['C',0,0,0],['H',t,t,t],['H',-t,-t,t],['H',-t,t,-t],['H',t,-t,-t]],bd:[[0,1,1],[0,2,1],[0,3,1],[0,4,1]],i:'Tetrahedral · bond angle 109.5° · sp³ hybridisation · non-polar.'},
 co2:{n:'Carbon dioxide',f:'CO₂',at:[['C',0,0,0],['O',-1.16,0,0],['O',1.16,0,0]],bd:[[0,1,2],[0,2,2]],i:'Linear · bond angle 180° · sp hybridisation · two C=O double bonds · non-polar overall.'},
 ammonia:{n:'Ammonia',f:'NH₃',at:[['N',0,.3,0],['H',.85,-.15,0],['H',-.42,-.15,.74],['H',-.42,-.15,-.74]],bd:[[0,1,1],[0,2,1],[0,3,1]],i:'Trigonal pyramidal · bond angle ≈107° · sp³ (1 lone pair on N) · polar.'},
 hcl:{n:'Hydrogen chloride',f:'HCl',at:[['Cl',0,0,0],['H',1.27,0,0]],bd:[[0,1,1]],i:'Linear · polar covalent bond (Cl more electronegative) · dipole moment ≈ 1.03 D.'},
 o2:{n:'Oxygen',f:'O₂',at:[['O',-.6,0,0],['O',.6,0,0]],bd:[[0,1,2]],i:'O=O double bond (1σ + 1π) · non-polar · paramagnetic (2 unpaired electrons, MOT).'},
 n2:{n:'Nitrogen',f:'N₂',at:[['N',-.55,0,0],['N',.55,0,0]],bd:[[0,1,3]],i:'N≡N triple bond (1σ + 2π) · very stable, high bond energy · non-polar.'},
 bf3:{n:'Boron trifluoride',f:'BF₃',at:[['B',0,0,0],['F',0,1.3,0],['F',-1.13,-.65,0],['F',1.13,-.65,0]],bd:[[0,1,1],[0,2,1],[0,3,1]],i:'Trigonal planar · bond angle 120° · sp² · incomplete octet on B (6 electrons) · Lewis acid.'},
 ethene:{n:'Ethene',f:'C₂H₄',at:[['C',-.67,0,0],['C',.67,0,0],['H',-1.24,.93,0],['H',-1.24,-.93,0],['H',1.24,.93,0],['H',1.24,-.93,0]],bd:[[0,1,2],[0,2,1],[0,3,1],[1,4,1],[1,5,1]],i:'Planar · bond angle ≈ 120° · sp² · C=C has one σ and one π bond.'},
 ethyne:{n:'Ethyne',f:'C₂H₂',at:[['C',-.6,0,0],['C',.6,0,0],['H',-1.66,0,0],['H',1.66,0,0]],bd:[[0,1,3],[0,2,1],[1,3,1]],i:'Linear · bond angle 180° · sp · C≡C has one σ and two π bonds.'}};
{const bz={n:'Benzene',f:'C₆H₆',at:[],bd:[],i:'Planar hexagon · all C–C bonds equal (139 pm) · 120° · sp² · delocalised π electrons (resonance, aromatic). Kekulé structure shown.'};
for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.at.push(['C',1.4*Math.cos(a),1.4*Math.sin(a),0])}
for(let k=0;k<6;k++){const a=k*Math.PI/3;bz.at.push(['H',2.5*Math.cos(a),2.5*Math.sin(a),0])}
for(let k=0;k<6;k++){bz.bd.push([k,(k+1)%6,k%2?1:2]);bz.bd.push([k,k+6,1])}
MOLS.benzene=bz}
function buildMol(k){
  clearAll();const m=MOLS[k];
  m.at.forEach(a=>{group.add(sph(RAD[a[0]],COL[a[0]],[a[1],a[2],a[3]]));addLabel(a[0],[a[1],a[2]+RAD[a[0]],a[3]],null)});
  m.bd.forEach(b=>{const A=m.at[b[0]],B=m.at[b[1]];group.add(bond([A[1],A[2],A[3]],[B[1],B[2],B[3]],b[2]))});
  const html=`<span class="tag">Class 11–12 · NEET · JEE · Chemical Bonding</span><h2>${m.n} (${m.f})</h2><p>${m.i}</p>`;
  labels.forEach(l=>l.el.onclick=e=>{e.stopPropagation();showInfo(html)});showInfo(html)}

/* ---------- ANIMAL CELL (Biology) ---------- */
function buildCell(plant){
  clearAll();
  group.add(new THREE.Mesh(new THREE.SphereGeometry(2.2,40,28),mat(0x7fd1c0,{transparent:true,opacity:.14,depthWrite:false})));
  const O=[];
  const nuc=sph(.75,0x6b5bd6,[.2,.2,0]);group.add(nuc);group.add(sph(.22,0x2c2370,[.35,.35,.5]));
  O.push(['Nucleus',[.2,.95,0],'Controls the cell and stores DNA. Surrounded by a double nuclear envelope with pores. Nucleolus makes rRNA.']);
  [[-1.2,-.6,.6,.3],[1.3,-.8,-.3,-.4]].forEach(p=>{const m=sph(.4,0xf08a3c,[p[0],p[1],p[2]]);m.scale.set(1.6,.8,.8);m.rotation.z=p[3];group.add(m)});
  O.push(['Mitochondrion',[-1.2,-.1,.6],'"Powerhouse of the cell." Site of Krebs cycle and oxidative phosphorylation – makes ATP. Has its own circular DNA and 70S ribosomes.']);
  const er=new THREE.Mesh(new THREE.TorusKnotGeometry(.35,.08,80,8,2,3),mat(0x4aa3e8));er.position.set(1,.9,.6);group.add(er);
  O.push(['Endoplasmic reticulum',[1,1.4,.6],'Network of membranes. Rough ER (with ribosomes) makes proteins; smooth ER makes lipids and detoxifies.']);
  for(let i=0;i<4;i++){const g=new THREE.Mesh(new THREE.TorusGeometry(.45-i*.04,.06,8,30),mat(0xe8c13a));g.rotation.x=Math.PI/2;g.position.set(-1,.9+i*.17,.2);g.scale.set(1,1,.5);group.add(g)}
  O.push(['Golgi apparatus',[-1,1.75,.2],'Stack of flattened sacs (cisternae). Modifies, sorts and packages proteins and lipids for secretion.']);
  if(!plant)group.add(sph(.2,0xd94f8c,[.6,-1.2,.9]));
  if(!plant)O.push(['Lysosome',[.6,-1.0,.9],'"Suicide bag." Membrane-bound sac of hydrolytic enzymes that digest worn-out organelles and foreign matter.']);
  for(let i=0;i<30;i++){const a=Math.random()*6.28,b=Math.acos(2*Math.random()-1),r=1.0+Math.random()*1;group.add(sph(.05,0x333333,[r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b)]))}
  O.push(['Ribosome',[0,-1.7,.4],'Tiny RNA–protein particles (80S in eukaryotes) that carry out protein synthesis (translation).']);
  O.push(['Cell membrane',[1.6,0,1.5],'Fluid mosaic model (Singer & Nicolson). Selectively permeable phospholipid bilayer with proteins and cholesterol.']);
  if(plant){group.add(new THREE.Mesh(new THREE.SphereGeometry(2.35,40,28),mat(0x9bd36b,{transparent:true,opacity:.12,depthWrite:false})));
  [[-.2,-1.3,-.4],[1.2,-.1,1],[-1.5,.1,-.9]].forEach(p=>{const c=sph(.3,0x2f9e44,p);c.scale.set(1.5,.8,.8);group.add(c)});
  group.add(sph(.55,0x6ec6ff,[.8,-.9,-.9],{transparent:true,opacity:.55}));
  O.push(['Cell wall',[2.2,.6,.9],'Rigid outer layer of cellulose (plants only). Gives shape and protection; fully permeable.'],['Chloroplast',[1.2,.4,1],'Site of photosynthesis. Chlorophyll in thylakoids (stacked as grana); stroma has Calvin-cycle enzymes. Has its own DNA.'],['Large central vacuole',[.8,-.3,-.9],'Filled with cell sap, bounded by tonoplast. Maintains turgor pressure; stores nutrients and wastes.'])}
  O.forEach(o=>addLabel(o[0],o[1],`<span class="tag">Class 9–11 · NEET · Cell Biology</span><h2>${o[0]}</h2><p>${o[2]}</p>${ORGMAP[o[0]]?`<button onclick="openOrg('${ORGMAP[o[0]]}')">Inner structure →</button>`:''}`));
  showInfo(`<span class="tag">Class 9–11 · NEET</span><h2>${plant?'Plant':'Animal'} cell</h2><p>Drag to rotate, pinch/scroll to zoom. Tap any label to learn its function.</p>`)}

/* ---------- INSIDE ORGANELLES (Biology) ---------- */
const ORGMAP={'Nucleus':'nucleus','Mitochondrion':'mito','Chloroplast':'chloro','Golgi apparatus':'golgi','Endoplasmic reticulum':'er','Ribosome':'ribo','Lysosome':'lyso','Cell membrane':'memb'};
const SH=(r,c,op,sc)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(c,{transparent:true,opacity:op,depthWrite:false}));if(sc)m.scale.set(...sc);group.add(m);return m};
const CY=(rt,h,c,pos,rot,sc)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rt,h,20),mat(c));m.position.set(...pos);if(rot)m.rotation.set(...rot);if(sc)m.scale.set(...sc);group.add(m);return m};
const TO=(R,t,c,pos,rot,sc)=>{const m=new THREE.Mesh(new THREE.TorusGeometry(R,t,10,48),mat(c));m.position.set(...pos);if(rot)m.rotation.set(...rot);if(sc)m.scale.set(...sc);group.add(m);return m};
const DOT=(r,c,pos)=>{const m=sph(r,c,pos);group.add(m);return m};
const rnd=(a,b)=>a+Math.random()*(b-a),PI=Math.PI;
const ORG={
nucleus:{n:'Nucleus',build(){

let curSubj='';const CSUB='Chemistry · Compound Search';
const SUG=['Glucose','Fructose','Sucrose','Aspirin','Paracetamol','Ibuprofen','Caffeine','Nicotine','Morphine','Cisplatin','Ethanol','Methanol','Acetone','Formaldehyde','Acetic acid','Chloroform','Benzene','Toluene','Phenol','Aniline','Naphthalene','Urea','Glycine','Alanine','Cysteine','Adenine','Guanine','Cytosine','Thymine','Uracil','ATP','Cholesterol','Testosterone','Estradiol','Dopamine','Serotonin','Adrenaline','Vitamin C','Sulfuric acid','Nitric acid','Hydrogen peroxide','Ozone','Buckminsterfullerene'];
const CPK={H:0xf2f2f2,C:0x4a4f55,N:0x4a7bff,O:0xe0524a,S:0xffd23f,P:0xff9f1a,Cl:0x39c24a,F:0x7ee07e,Br:0xa52a2a,I:0x7b3fa0,Na:0xab5cf2,K:0x8f40d4,Ca:0x3dff00,Mg:0x8aff00,Fe:0xe06633,Zn:0x7d80b0,Cu:0xc88033,B:0xe8a0a0,Si:0xf0c8a0};
const RADS={H:.3,C:.44,N:.44,O:.46,F:.4};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function parseSDF(t){const L=t.split('\n'),na=+L[3].slice(0,3),nb=+L[3].slice(3,6);if(!(na>0))throw 0;
  const at=[],bd=[];for(let i=0;i<na;i++){const p=L[4+i].trim().split(/\s+/);at.push([p[3],+p[0],+p[1],+p[2]])}
  for(let i=0;i<nb;i++){const l=L[4+na+i];bd.push([+l.slice(0,3)-1,+l.slice(3,6)-1,+l.slice(6,9)])}return{at,bd}}
async function searchCompound(q){
  clearAll();showInfo('<p>'+esc(q)+' load ho raha hai…</p>');
  const P='https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/';
  const load=async base=>{let dim='3D',r=await fetch(base+'/SDF?record_type=3d');if(!r.ok){dim='2D';r=await fetch(base+'/SDF?record_type=2d')}
    if(!r.ok)return false;const m=parseSDF(await r.text());let pr={};
    try{pr=(await(await fetch(base+'/property/MolecularFormula,MolecularWeight,IUPACName/JSON')).json()).PropertyTable.Properties[0]}catch(e){}
    buildCompound(q,m,pr,dim);return true};
  try{
    if(await load(P+'name/'+encodeURIComponent(q)))return;
    if(/^([A-Z][a-z]?\d*)+$/.test(q)){const c=(await(await fetch(P+'fastformula/'+q+'/cids/JSON?MaxRecords=1')).json()).IdentifierList.CID[0];if(await load(P+'cid/'+c))return}
    throw 0}
  catch(e){showInfo('<h2>Nahi mila</h2><p>Naam (English), formula (jaise C6H12O6) ya CAS number likhein, aur internet on rakhein.</p>')}}
function buildCompound(q,m,pr,dim){
  clearAll();const n=m.at.length,c=m.at.reduce((a,p)=>[a[0]+p[1],a[1]+p[2],a[2]+p[3]],[0,0,0]).map(v=>v/n),geo={};let R=0;
  const pos=m.at.map(p=>[p[1]-c[0],p[2]-c[1],p[3]-c[2]]);
  m.at.forEach((p,i)=>{const r=RADS[p[0]]||.5,col=CPK[p[0]]||0x9aa7a4;R=Math.max(R,Math.hypot(...pos[i])+r);
    const g=geo[r]||(geo[r]=new THREE.SphereGeometry(r,n>80?10:24,n>80?8:18)),mesh=new THREE.Mesh(g,mat(col));mesh.position.set(...pos[i]);group.add(mesh);
    if(n<=30&&p[0]!=='H')addLabel(p[0],[pos[i][0],pos[i][1]+r,pos[i][2]],null)});
  m.bd.forEach(b=>group.add(bond(pos[b[0]],pos[b[1]],Math.min(b[2],3))));
  zoom=Math.min(40,Math.max(7,R*2.6+1.5));
  showInfo(`<span class="tag">PubChem (NIH) · ${dim} structure</span><h2>${esc(q)}</h2><p>Formula: ${esc(pr.MolecularFormula||'-')} · Mol. weight: ${esc(pr.MolecularWeight||'-')} g/mol</p><p>${esc(pr.IUPACName||'')}</p><p>${n} atoms · ${m.bd.length} bonds${dim=='2D'?' (flat 2D layout, hydrogens not shown)':''}</p>`)}

function loop(){
  requestAnimationFrame(loop);
  if(autoRot&&!ptr.size)group.rotation.y+=.004;
  anim.forEach(o=>{o.a+=o.s;o.m.position.set(Math.cos(o.a)*o.r,Math.sin(o.a)*o.r,0)});
  camera.position.z=zoom;
  group.updateMatrixWorld(true);
  const w=stage.clientWidth,h=stage.clientHeight;
  labels.forEach(l=>{v.copy(l.pos);group.localToWorld(v);v.project(camera);
    l.el.style.display=showLab?'block':'none';
    l.el.style.left=((v.x+1)/2*w)+'px';l.el.style.top=((1-v.y)/2*h)+'px'});
  renderer.render(scene,camera)}
resize();pickSubj('Chemistry · Periodic Table');loop();
</script>
